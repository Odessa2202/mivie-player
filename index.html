<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mivie player</title>
<style>html,body{margin:0;height:100%;background:#000}#p,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head><body><div id="p"></div>
<script>
// Mivie's video player page. A real website, so YouTube knows where the player is (apps without one are often refused).
// Used as: index.html?v=VIDEO_ID&start=SECONDS&end=SECONDS
var q = new URLSearchParams(location.search);
function tell(m){ try { window.webkit.messageHandlers.mivie.postMessage(m) } catch(e) {} }
var vars = {playsinline:1, rel:0, modestbranding:1, autoplay:1, origin: location.origin};
if (q.get('start')) vars.start = parseInt(q.get('start'));
if (q.get('end')) vars.end = parseInt(q.get('end'));
function onYouTubeIframeAPIReady(){
  new YT.Player('p', {videoId: q.get('v'), host: 'https://www.youtube.com', playerVars: vars,
    events: {onReady: function(e){ e.target.playVideo() },
             onStateChange: function(e){ if (e.data === 1) tell('playing') },
             onError: function(e){ tell('error:' + e.data) }}});
}
setTimeout(function(){ if (!window.YT) tell('error:load') }, 8000);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
